name: Backend CI Pipeline

on:
  push:
    branches: [ main, joseph ]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'migrations/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, joseph ]
    paths:
      - 'services/**'
      - 'shared/**'
      - 'migrations/**'
      - 'deploy/**'
      - 'docker-compose.yml'
      - '.github/workflows/backend-ci.yml'

jobs:
  code-quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Run Ruff Linter
        run: |
          ruff check services/ shared/ || true

      - name: Check Code Formatting with Black
        run: |
          black --check services/ shared/ || true

  test-matrix:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - api-gateway
          - auth-service
          - billing-service
          - consultation-service
          - laboratory-service
          - master-service
          - notification-service
          - patient-service
          - pharmacy-service
          - radiology-service
          - reception-service
          - report-service
          - triage-service
          - visit-service
          - ward-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies for ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov httpx
          if [ -f services/${{ matrix.service }}/requirements.txt ]; then
            pip install -r services/${{ matrix.service }}/requirements.txt
          fi
          if [ -f shared/requirements.txt ]; then
            pip install -r shared/requirements.txt
          fi

      - name: Execute Tests for ${{ matrix.service }}
        env:
          PYTHONPATH: .:services/${{ matrix.service }}:shared
          SECRET_KEY: ci-test-secret-key-for-testing-purposes-only
          TESTING: 'true'
        run: |
          if [ -d services/${{ matrix.service }}/tests ]; then
            pytest services/${{ matrix.service }}/tests -v || true
          else
            echo "No tests directory for ${{ matrix.service }}, skipping."
          fi

  docker-build-check:
    name: Validate Docker Containers Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build All Microservice Docker Images
        run: |
          docker compose -f infrastructure/docker-compose.yml build --parallel

  migration-check:
    name: Validate Alembic Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hospital_master_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Migration Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic psycopg2-binary sqlalchemy

      - name: Validate Master DB Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/hospital_master_test
          PYTHONPATH: .:services/master-service:shared
        run: |
          if [ -f migrations/master/alembic.ini ]; then
            alembic -c migrations/master/alembic.ini upgrade heads
          else
            echo "No master alembic config found, skipping."
          fi
