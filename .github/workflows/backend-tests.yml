name: Backend Test Suite

# Reusable workflow — the single source of truth for backend tests.
# Called by backend-pr-checks.yml, backend-staging.yml, and
# backend-production.yml so all three run the exact same checks and never
# drift out of sync with each other.
on:
  workflow_call:

permissions:
  contents: read
  checks: write

env:
  PYTHONPATH: .:shared
  TESTING: 'true'
  SECRET_KEY: ci-test-secret-key-for-testing-purposes-only
  DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/hospital_master_test
  MASTER_DB_URL: postgresql://postgres:postgrespassword@localhost:5432/hospital_master_test
  TENANT_DB_URL: postgresql://postgres:postgrespassword@localhost:5432/hospital_tenant_test
  REDIS_URL: redis://localhost:6379/0
  RABBITMQ_URL: amqp://guest:guest@localhost:5672/
  KEYCLOAK_URL: http://localhost:8080
  KEYCLOAK_REALM: hospital
  KEYCLOAK_CLIENT_ID: hospital-backend
  KEYCLOAK_CLIENT_SECRET: ci-test-keycloak-client-secret
  KEYCLOAK_ADMIN_USERNAME: admin
  KEYCLOAK_ADMIN_PASSWORD: admin
  TENANT_DB_ENCRYPTION_KEY: u67aHw6vkhhB_0HUpBa-EU8P9KBeHkzqaKFsP2LDZ0k=

jobs:
  compile-and-fatal-quality:
    name: Compile and fatal static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff black mypy
      - name: Compile all backend Python
        run: python -m compileall -q services shared tests scripts
      - name: Enforce test surface for every microservice
        run: |
          set -euo pipefail
          for service_dir in services/*-service services/api-gateway; do
            test -n "$(find "$service_dir/tests/unit" -type f -name 'test_*.py' -print -quit 2>/dev/null)" \
              || { echo "Missing unit tests: $service_dir"; exit 1; }
            test -n "$(find "$service_dir/tests/integration" -type f -name 'test_*.py' -print -quit 2>/dev/null)" \
              || { echo "Missing integration tests: $service_dir"; exit 1; }
          done
          if rg -ni --glob 'test_*.py' 'assert True|placeholder test|minimal placeholder' services/*-service/tests services/api-gateway/tests; then
            echo 'Placeholder tests are not permitted.'
            exit 1
          fi
      - name: Fail on fatal Ruff findings
        run: ruff check --select E9,F63,F7,F82 services shared tests scripts
      - name: Report formatting debt without masking fatal checks
        run: |
          black --check services shared tests scripts \
            || echo "::warning::Formatting debt exists — run 'black services shared tests scripts' locally to clean up. Not blocking."
      - name: Report type-check debt
        run: |
          mypy services shared --ignore-missing-imports --explicit-package-bases \
            || echo "::warning::Type-check debt exists — see mypy output above. Not blocking."

  service-tests:
    name: Tests - ${{ matrix.service }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hospital_master_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-service
          - api-gateway
          - auth-service
          - billing-service
          - consultation-service
          - laboratory-service
          - master-service
          - notification-service
          - patient-service
          - pharmacy-service
          - radiology-service
          - reception-service
          - report-service
          - triage-service
          - visit-service
          - ward-service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio pytest-cov httpx
          python -m pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Collect tests and fail on collection errors
        env:
          PYTHONPATH: .:services/${{ matrix.service }}:shared
        run: |
          set -o pipefail
          count=$(pytest services/${{ matrix.service }}/tests --collect-only -q | awk '/collected/{print $1; exit}')
          test "${count:-0}" -gt 0
      - name: Run service tests with coverage
        env:
          PYTHONPATH: .:services/${{ matrix.service }}:shared
        run: |
          pytest services/${{ matrix.service }}/tests \
            --cov=services/${{ matrix.service }}/app \
            --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.service }}.xml \
            --junitxml=junit-${{ matrix.service }}.xml \
            -ra -v
      - name: Upload service coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.service }}
          path: coverage-${{ matrix.service }}.xml
          if-no-files-found: ignore
      - name: Upload service test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ matrix.service }}
          path: junit-${{ matrix.service }}.xml
          if-no-files-found: ignore

  shared-messaging-integration:
    name: Shared RabbitMQ integration
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install messaging dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio aio-pika
      - name: Run shared messaging integration tests
        run: pytest tests/integration/test_messaging.py -ra -v

  migration-check:
    name: Validate master and tenant migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hospital_master_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install migration dependencies
        run: python -m pip install --upgrade pip alembic psycopg2-binary sqlalchemy
      - name: Validate master migration graph and upgrade
        env:
          PYTHONPATH: .:services/master-service:shared
        run: |
          test "$(alembic -c migrations/master/alembic.ini heads | grep -c '(head)')" -eq 1
          alembic -c migrations/master/alembic.ini upgrade head
      - name: Create clean tenant database
        env:
          PGPASSWORD: postgrespassword
        run: psql -h localhost -U postgres -d hospital_master_test -c 'CREATE DATABASE hospital_tenant_test;'
      - name: Validate tenant migration graph and upgrade
        env:
          PYTHONPATH: .:services/master-service:shared
          TENANT_DB_URL: postgresql://postgres:postgrespassword@localhost:5432/hospital_tenant_test
        run: |
          test "$(alembic -c migrations/tenant/alembic.ini heads | grep -c '(head)')" -eq 1
          alembic -c migrations/tenant/alembic.ini upgrade head

  docker-build-check:
    name: Validate Docker compose configuration and builds
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      SECRET_KEY: ci-secret-key
      TENANT_DB_ENCRYPTION_KEY: u67aHw6vkhhB_0HUpBa-EU8P9KBeHkzqaKFsP2LDZ0k=
      KEYCLOAK_ADMIN_PASSWORD: ci-keycloak-password
      KEYCLOAK_CLIENT_SECRET: ci-keycloak-client-secret
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: ci-rabbit-password
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Ensure env file exists for compose validation
        run: cp .env.example .env || touch .env
      - name: Validate compose model
        run: docker compose -f infrastructure/docker-compose.yml config --quiet
      - name: Build all backend images
        run: docker compose -f infrastructure/docker-compose.yml build --parallel

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - compile-and-fatal-quality
      - service-tests
      - shared-messaging-integration
      - migration-check
      - docker-build-check
    steps:
      - uses: actions/checkout@v5

      - name: Download all JUnit results
        uses: actions/download-artifact@v6
        with:
          pattern: junit-*
          path: junit-results
          merge-multiple: true

      - name: Publish combined test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Pytest Results
          path: 'junit-results/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Write job status summary
        if: always()
        run: |
          {
            echo "## Backend CI Summary"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Compile and fatal static checks | ${{ needs.compile-and-fatal-quality.result }} |"
            echo "| Service tests (matrix) | ${{ needs.service-tests.result }} |"
            echo "| Shared RabbitMQ integration | ${{ needs.shared-messaging-integration.result }} |"
            echo "| Migration validation | ${{ needs.migration-check.result }} |"
            echo "| Docker build check | ${{ needs.docker-build-check.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
