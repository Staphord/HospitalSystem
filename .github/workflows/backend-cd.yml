name: Backend CD Production Deployment Pipeline

on:
  workflow_run:
    workflows: ["Backend CI Pipeline"]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types:
      - frontend-deployment-failed

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy full backend and notify frontend
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Set immutable release identity
        id: release
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d%H%M%S)-${DEPLOY_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Deploy full release on production host
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/hospital-backend
            test -z "$(git status --porcelain)" || { echo 'Deployment checkout is dirty'; exit 1; }
            git fetch --prune origin main
            git cat-file -e '${{ steps.release.outputs.sha }}^{commit}'
            git checkout --detach '${{ steps.release.outputs.sha }}'
            sudo DEPLOY_SHA='${{ steps.release.outputs.sha }}' ./deploy/deploy-atomic.sh stage '${{ steps.release.outputs.tag }}'
            sudo /var/www/hospital-backend/deploy/deploy-atomic.sh activate '${{ steps.release.outputs.tag }}'

      - name: Verify backend production health
        id: health_check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            curl -s -f http://127.0.0.1:8000/health || (sudo /var/www/hospital-backend/deploy/deploy-atomic.sh rollback && exit 1)

      - name: Trigger frontend deployment for deployed backend release
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: Staphord/HospitalSystem-FrontEnd
          event-type: backend-staged-success
          client-payload: >-
            {"release_tag":"${{ steps.release.outputs.tag }}",
             "sha":"${{ steps.release.outputs.sha }}"}

      - name: Roll back if deployment or verification failed
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo /var/www/hospital-backend/deploy/deploy-atomic.sh rollback

  rollback-on-frontend-failure:
    name: Roll back backend when frontend deployment fails
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'frontend-deployment-failed'
    steps:
      - name: Execute atomic rollback on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo /var/www/hospital-backend/deploy/deploy-atomic.sh rollback



