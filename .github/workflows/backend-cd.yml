name: Backend CD Production Deployment Pipeline

on:
  workflow_run:
    workflows: ["Backend CI Pipeline"]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types:
      - frontend-deployment-failed

permissions:
  contents: read

concurrency:
  group: backend-production-deployment
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy full backend and notify frontend
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Set immutable release identity
        id: release
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "sha=${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d%H%M%S)-${DEPLOY_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Deploy full release on production host
        id: deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /var/www/hospital-backend
            test -z "$(git status --porcelain)" || { echo 'Deployment checkout is dirty'; exit 1; }
            git fetch --prune origin main
            git cat-file -e '${{ steps.release.outputs.sha }}^{commit}'
            git checkout --detach '${{ steps.release.outputs.sha }}'
            sudo ./deploy/deploy-atomic.sh stage '${{ steps.release.outputs.tag }}'
            sudo /var/www/hospital-backend/deploy/deploy-atomic.sh activate '${{ steps.release.outputs.tag }}'

      - name: Verify backend production health
        id: health_check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            echo "Waiting for Production Health Probe on port 8000..."
            healthy=0
            for i in {1..30}; do
              if curl -s -f http://127.0.0.1:8000/health >/dev/null 2>&1; then
                healthy=1
                echo "Production Health Probe Passed!"
                break
              fi
              sleep 2
            done

            if [ "$healthy" -eq 0 ]; then
              echo "Production Health Probe Failed! Rolling back..."
              sudo /var/www/hospital-backend/deploy/deploy-atomic.sh rollback
              exit 1
            fi

            echo "Verifying all 16 production microservices container states..."
            unhealthy=0
            for service in api-gateway auth-service master-service patient-service visit-service reception-service triage-service consultation-service laboratory-service radiology-service pharmacy-service billing-service ward-service admin-service notification-service report-service; do
              service_ok=0
              for attempt in {1..5}; do
                status=$(docker inspect --format '{{.State.Status}}' "hospital-${service}" 2>/dev/null || echo "missing")
                if [ "$status" = "running" ]; then
                  service_ok=1
                  break
                fi
                sleep 2
              done

              if [ "$service_ok" -eq 1 ]; then
                echo "OK: ${service} is running."
              else
                echo "ERROR: ${service} is not running! State: ${status}"
                unhealthy=1
              fi
            done

            if [ "$unhealthy" -ne 0 ]; then
              echo "Production Deployment Failed: One or more microservices are not running! Rolling back..."
              sudo /var/www/hospital-backend/deploy/deploy-atomic.sh rollback
              exit 1
            fi

      - name: Trigger frontend deployment for deployed backend release
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CROSS_REPO_PAT }}
          repository: Staphord/HospitalSystem-FrontEnd
          event-type: backend-staged-success
          client-payload: >-
            {"release_tag":"${{ steps.release.outputs.tag }}",
             "sha":"${{ steps.release.outputs.sha }}"}

      - name: Roll back if deployment or verification failed
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo /var/www/hospital-backend/deploy/deploy-atomic.sh rollback

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Backend Production Deployment Summary"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Release tag | \`${{ steps.release.outputs.tag }}\` |"
            echo "| Commit SHA | \`${{ steps.release.outputs.sha }}\` |"
            echo "| Deploy (stage + activate) | ${{ steps.deploy.outcome || 'skipped' }} |"
            echo "| Health check | ${{ steps.health_check.outcome || 'skipped' }} |"
            echo "| Frontend notified | ${{ job.status == 'success' && 'yes (backend-staged-success)' || 'no' }} |"
            echo "| Overall result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback-on-frontend-failure:
    name: Roll back backend when frontend deployment fails
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'frontend-deployment-failed'
    steps:
      - name: Execute atomic rollback on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sudo /var/www/hospital-backend/deploy/deploy-atomic.sh rollback

      - name: Write rollback summary
        if: always()
        run: |
          {
            echo "## Backend Rollback Summary (triggered by frontend failure)"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Trigger | frontend-deployment-failed |"
            echo "| Release tag | \`${{ github.event.client_payload.release_tag }}\` |"
            echo "| Commit SHA | \`${{ github.event.client_payload.sha }}\` |"
            echo "| Rollback result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
