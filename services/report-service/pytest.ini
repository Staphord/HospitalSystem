[pytest]
# See services/ward-service/pytest.ini for the full reasoning. In short: the
# repo root sets asyncio_mode in backend-hospitalsystem/pyproject.toml, but the
# Docker build context is this directory, so the root file never reaches the
# image. Without it, pytest runs in strict mode inside the container and the 24
# chat-history tests error during setup on their async session fixture.
asyncio_mode = auto
