[pytest]
# asyncio_mode is set at the repo root too, in backend-hospitalsystem/pyproject.toml.
# It is repeated here because the Docker build context is this directory, so
# `COPY . .` never carries the root file into the image: inside the container
# pytest finds no config at all, falls back to strict mode, and every test that
# takes the async `ward_db` fixture errors during setup with "requested an async
# fixture ... with no plugin or hook that handled it" - 10 of them.
#
# The tests were fine; only the container was missing the setting. Repeating it
# here is what pharmacy-service and clinical-decision-support-service already do.
asyncio_mode = auto
