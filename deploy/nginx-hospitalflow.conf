# Installed to /etc/nginx/sites-available/hospitalflow by 06-deploy-frontend.sh.
# Single entry point on port 80: serves the built React SPA and reverse-proxies
# /api/ straight through to the api-gateway on 127.0.0.1:8000 — same origin,
# so the browser never needs CORS. Bare-IP setup; add TLS with
# `certbot --nginx` once you point a domain at this box.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/hospitalflow;
    index index.html;

    client_max_body_size 20m;

    # Gateway's own routing table matches on the full /api/v1/... prefix,
    # so proxy_pass here must NOT rewrite the path — no trailing slash/URI
    # on proxy_pass, so nginx forwards the request URI unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Notifications use Server-Sent Events (long-lived GET) — disable buffering.
    location /api/v1/notifications/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
