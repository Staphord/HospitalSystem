name: hospitalsystem-staging

networks:
  hospital-network:
    external: true
    name: hospitalsystem_hospital-network

services:
  staging-bootstrap:
    profiles:
      - tools
    build:
      context: ../services/master-service
      dockerfile: Dockerfile
    container_name: hospital-staging-bootstrap
    command: ["python", "/app/scripts/bootstrap.py"]
    env_file:
      - ../.env
    volumes:
      - ../scripts:/app/scripts:ro
    networks:
      - hospital-network
    restart: "no"

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: hospital-staging-api-gateway
    environment:
      - AUTH_SERVICE_URL=http://hospital-staging-auth-service:8001
      - MASTER_SERVICE_URL=http://hospital-staging-master-service:8002
      - PATIENT_SERVICE_URL=http://hospital-staging-patient-service:8005
      - VISIT_SERVICE_URL=http://hospital-staging-visit-service:8006
      - RECEPTION_SERVICE_URL=http://hospital-staging-reception-service:8010
      - TRIAGE_SERVICE_URL=http://hospital-staging-triage-service:8011
      - CONSULTATION_SERVICE_URL=http://hospital-staging-consultation-service:8012
      - LABORATORY_SERVICE_URL=http://hospital-staging-laboratory-service:8013
      - RADIOLOGY_SERVICE_URL=http://hospital-staging-radiology-service:8014
      - PHARMACY_SERVICE_URL=http://hospital-staging-pharmacy-service:8015
      - BILLING_SERVICE_URL=http://hospital-staging-billing-service:8016
      - WARD_SERVICE_URL=http://hospital-staging-ward-service:8017
      - ADMIN_SERVICE_URL=http://hospital-staging-admin-service:8018
      - NOTIFICATION_SERVICE_URL=http://hospital-staging-notification-service:8019
      - REPORT_SERVICE_URL=http://hospital-staging-report-service:8020
    ports:
      - "127.0.0.1:8100:8000"
    env_file:
      - ../.env
    depends_on:
      master-service:
        condition: service_healthy
    volumes:
      - ../shared:/app/shared:ro
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: hospital-staging-auth-service
    ports:
      - "127.0.0.1:8101:8001"
    env_file:
      - ../.env
    depends_on:
      master-service:
        condition: service_healthy
    volumes:
      - ../migrations:/app/migrations:ro
      - ../shared:/app/shared:ro
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

