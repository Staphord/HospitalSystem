      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_INTROSPECT: "false"
      ALLOWED_ORIGINS: http://localhost:8000,http://localhost:8501,https://gilgali.com,http://gilgali.com
