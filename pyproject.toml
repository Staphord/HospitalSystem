[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services"]
addopts = "-ra"

[tool.coverage.run]
branch = true
omit = [
  "*/tests/*",
  "*/migrations/*",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
show_missing = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
